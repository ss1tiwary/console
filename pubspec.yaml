name: resolve_console
description: >-
  Resolve Console — the single internal admin surface for the whole platform.
  Composes pillar admin operations (Question Bank extraction & review, Content
  moderation, ideas) over the shared Supabase backend; editor-gated, with all
  writes enforced server-side by RLS. Desktop + web (where the work happens).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Shared Question Bank renderer + domain model.
  qbank_ui:
    path: ../packages/qbank_ui

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Supabase (same project as the rest of the platform)
  supabase_flutter: ^2.8.0

  # File upload (PDF / image) for extraction tool — web + Windows only targets,
  # no Android so compileSdk 36 constraint never applies here.
  file_picker: ^8.1.2

  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
